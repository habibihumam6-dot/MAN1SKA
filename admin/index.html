<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel Operator - MAN1SKA TV</title>
  <link rel="icon" type="image/png" href="../icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../supabase-config.js"></script>
  <script defer src="admin.js"></script>
</head>
<body>
<header class="bar">
  <strong>Panel Operator <span>MAN1SKA TV</span></strong>
  <div class="bar-r"><a href="../index.html" target="_blank" rel="noopener">Lihat web</a><button id="logout" type="button" hidden></button></div>
</header>
<main>
  <form id="login" class="card login">
    <h1>Masuk</h1>
    <label>Email<input type="email" name="email" required autocomplete="username"></label>
    <label>Kata sandi<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn" id="login-btn">Masuk</button>
    <p class="msg" id="login-msg" role="alert"></p>
  </form>

  <div id="panel" class="grid" hidden>
    <section class="card">
      <h1 id="form-title">Buat Berita baru</h1>
      <div class="types" id="types" role="group" aria-label="Jenis konten"></div>

      <form id="post" autocomplete="off">
        <div class="row">
          <label data-for="berita">Kategori
            <select name="jenis"><option>Berita</option><option>Vlog</option><option>Dokumentasi</option></select>
          </label>
          <label><span id="l-tgl">Tanggal</span><input type="date" name="tanggal" required></label>
        </div>

        <label data-for="instagram">Link Reels atau postingan Instagram
          <input type="url" name="ig" required placeholder="https://www.instagram.com/reel/...">
        </label>
        <label data-for="youtube">Link video YouTube
          <input type="url" name="youtube" required placeholder="https://www.youtube.com/watch?v=...">
          <img class="prev" id="yt-prev" alt="Sampul video" hidden>
        </label>

        <label><span id="l-judul">Judul</span><input name="judul" required maxlength="120"></label>
        <label data-for="berita program">Ringkasan singkat <small>(tampil di kartu)</small>
          <textarea name="ringkasan" rows="2" maxlength="180" required></textarea>
        </label>
        <label data-for="berita program"><span id="l-isi">Isi berita</span> <small>(tekan Enter dua kali untuk paragraf baru)</small>
          <textarea name="isi" rows="8"></textarea>
        </label>

        <label data-for="berita program instagram"><span id="l-cover">Foto sampul</span>
          <input type="file" name="cover" accept="image/*">
          <img class="prev" id="cover-prev" alt="Pratinjau sampul" hidden>
        </label>
        <label data-for="berita program">Foto dokumentasi <small>(boleh banyak sekaligus)</small>
          <input type="file" name="foto" accept="image/*" multiple>
        </label>

        <details data-for="berita program" id="links">
          <summary>Tautan video (boleh kosong)</summary>
          <label>Link Reels Instagram<input type="url" name="x_ig" placeholder="https://www.instagram.com/reel/..."></label>
          <label>Link TikTok<input type="url" name="x_tiktok" placeholder="https://www.tiktok.com/..."></label>
          <label>Link YouTube<input type="url" name="x_youtube" placeholder="https://www.youtube.com/watch?v=..."></label>
          <p class="hint">Tombolnya muncul di halaman berita. Link Instagram dan YouTube juga ikut masuk ke galeri masing-masing.</p>
        </details>

        <label class="check"><input type="checkbox" name="terbit" checked> Terbitkan sekarang (hilangkan centang untuk menyimpan sebagai draf)</label>
        <div class="actions">
          <button class="btn" id="save">Simpan</button>
          <button class="btn ghost" id="cancel" type="button" hidden>Batal ubah</button>
        </div>
        <p class="msg" id="post-msg" role="status"></p>
      </form>
    </section>

    <section class="card">
      <h2>Konten yang sudah dibuat</h2>
      <div class="tabs" id="tabs" role="group" aria-label="Filter daftar"></div>
      <p class="msg" id="list-msg" role="status"></p>
      <ul id="list"></ul>
    </section>
  </div>
</main>
</body>
</html>
